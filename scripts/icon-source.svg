<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0b2530" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0fbff" />
      <stop offset="45%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Synapses -->
  <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="256" y1="256" x2="256" y2="120" />
    <line x1="256" y1="256" x2="374" y2="188" />
    <line x1="256" y1="256" x2="374" y2="324" />
    <line x1="256" y1="256" x2="256" y2="392" />
    <line x1="256" y1="256" x2="138" y2="324" />
    <line x1="256" y1="256" x2="138" y2="188" />
  </g>

  <!-- Peripheral nodes -->
  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="256" cy="120" r="16" />
    <circle cx="374" cy="188" r="16" />
    <circle cx="374" cy="324" r="16" />
    <circle cx="256" cy="392" r="16" />
    <circle cx="138" cy="324" r="16" />
    <circle cx="138" cy="188" r="16" />
  </g>

  <!-- Core -->
  <circle cx="256" cy="256" r="46" fill="url(#core)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="64" fill="none" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="3" />
</svg>
